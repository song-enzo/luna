<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>登录 · LUNA ATELIER</title>
<script>
if (window.location.protocol === 'file:') {
  window.location.href = 'http://127.0.0.1:8766/';
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f3f0;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid #e8e5e0;border-radius:12px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:36px}
.logo .main{font-family:'Playfair Display',Georgia,serif;font-size:28px;letter-spacing:4px;font-weight:700;color:#1a1a1a}
.logo .sub{font-size:12px;color:#999;margin-top:8px;letter-spacing:1.5px;text-transform:uppercase}
.logo .divider{width:40px;height:2px;background:#c9a96e;margin:12px auto 0;border-radius:1px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;color:#888;margin-bottom:6px;font-weight:500;letter-spacing:.5px}
.field input{width:100%;padding:12px 14px;border:1.5px solid #e0dcd5;border-radius:6px;font-size:15px;font-family:inherit;background:#fcfbf9;transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:#c9a96e;background:#fff;box-shadow:0 0 0 3px rgba(201,169,110,.1)}
.login-btn{width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;margin-top:8px;letter-spacing:1px}
.login-btn:hover{background:#333}
.login-btn:active{transform:scale(.98)}
.error-msg{color:#d4433f;font-size:12px;text-align:center;margin-top:12px;display:none}
.captcha-field{display:none;margin-top:18px}
.captcha-label{font-size:12px;color:#666;margin-bottom:6px;display:block}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="main">LUNA ATELIER</div>
    <div class="sub">高定服装定制系统</div>
    <div class="divider"></div>
  </div>
  <div class="field">
    <label>账号</label>
    <input type="text" id="username" placeholder="输入账号" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
  </div>
  <div class="field captcha-field" id="captchaField">
    <label class="captcha-label" id="captchaQuestion">安全验证</label>
    <input type="text" id="captchaAnswer" inputmode="numeric" autocomplete="off" placeholder="请输入计算结果">
  </div>
  <button class="login-btn" id="loginBtn">登 录</button>
  <div class="error-msg" id="errorMsg">账号或密码错误，请重试</div>
</div>
<script src="luna-data.js?v=39"></script>
<script>
document.getElementById('loginBtn').addEventListener('click', function() {
  var user = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value.trim();
  var captchaAnswer = document.getElementById('captchaAnswer').value.trim();
  var errEl = document.getElementById('errorMsg');

  var result = LUNA.login(user, pwd, captchaAnswer);
  if (result && !result.error) {
    errEl.style.display = 'none';
    LUNA.setUser(result);
    window.location.href = result.role === 'admin' ? 'dashboard.html' : (result.role === 'employee' ? LUNA.employeeDefaultPage(result) : 'guest-styles.html');
    return;
  }

  errEl.textContent = '账号或密码错误，请重试';
  if (result && result.captcha_required) {
    document.getElementById('captchaField').style.display = 'block';
    document.getElementById('captchaQuestion').textContent = '安全验证：' + (result.captcha_question || '请完成验证');
    document.getElementById('captchaAnswer').focus();
  }
  errEl.style.display = 'block';
});

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

var _exUser = LUNA.getUser();
if (_exUser && _exUser.role) {
  var _serverUser = LUNA.api('/api/me');
  if (_serverUser && !_serverUser.error && _serverUser.role) {
    LUNA.setUser(_serverUser);
    window.location.href = _serverUser.role === 'admin' ? 'dashboard.html' : (_serverUser.role === 'employee' ? LUNA.employeeDefaultPage(_serverUser) : 'guest-styles.html');
  } else {
    LUNA.clearUser();
  }
}
</script>
</body>
</html>
