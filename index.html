<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>登录 · LUNA ATELIER</title>
<script>
if (window.location.protocol === 'file:') {
  window.location.href = 'http://127.0.0.1:8766/';
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f3f0;color:#1a1a1a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid #e8e5e0;border-radius:12px;padding:40px 32px;width:100%;max-width:380px;box-shadow:0 12px 40px rgba(0,0,0,.06)}
.logo{text-align:center;margin-bottom:36px}
.logo .main{font-family:'Playfair Display',Georgia,serif;font-size:28px;letter-spacing:4px;font-weight:700;color:#1a1a1a}
.logo .sub{font-size:12px;color:#999;margin-top:8px;letter-spacing:1.5px;text-transform:uppercase}
.logo .divider{width:40px;height:2px;background:#c9a96e;margin:12px auto 0;border-radius:1px}
.field{margin-bottom:18px}
.field label{display:block;font-size:11px;color:#888;margin-bottom:6px;font-weight:500;letter-spacing:.5px}
.field input{width:100%;padding:12px 14px;border:1.5px solid #e0dcd5;border-radius:6px;font-size:15px;font-family:inherit;background:#fcfbf9;transition:border-color .2s,box-shadow .2s}
.field input:focus{outline:none;border-color:#c9a96e;background:#fff;box-shadow:0 0 0 3px rgba(201,169,110,.1)}
.login-btn{width:100%;padding:14px;background:#1a1a1a;color:#fff;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .15s,transform .1s;margin-top:8px;letter-spacing:1px}
.login-btn:hover{background:#333}
.login-btn:active{transform:scale(.98)}
.links{display:flex;justify-content:space-between;margin-top:18px;font-size:12px}
.links a{color:#999;text-decoration:none;transition:color .15s}
.links a:hover{color:#c9a96e}
.error-msg{color:#d4433f;font-size:12px;text-align:center;margin-top:12px;display:none}
.guest-btn{display:block;text-align:center;margin-top:16px;padding:10px;border:1px solid #e0dcd5;border-radius:6px;color:#888;font-size:13px;text-decoration:none;transition:all .15s}
.guest-btn:hover{border-color:#c9a96e;color:#c9a96e}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="main" id="loginBrandName" data-luna-brand>LUNA ATELIER</div>
    <div class="sub">高定服装定制系统</div>
    <div class="divider"></div>
  </div>
  <div class="field">
    <label>账号</label>
    <input type="text" id="username" placeholder="输入账号" autocomplete="username">
  </div>
  <div class="field">
    <label>密码</label>
    <input type="password" id="password" placeholder="输入密码" autocomplete="current-password">
  </div>
  <div class="field" id="captchaField" style="display:none">
    <label id="captchaLabel">验证码</label>
    <input type="text" id="captchaAnswer" placeholder="请输入答案" autocomplete="off">
  </div>
  <button class="login-btn" id="loginBtn">登 录</button>
  <div class="error-msg" id="errorMsg">账号或密码错误，请重试</div>
  <div class="links">
    <a href="javascript:void(0)" id="forgotPwd">忘记密码？</a>
  </div>
</div>
<script src="luna-data.js?v=39"></script>
<script>
(function() {
  var brandName = (LUNA && LUNA.getBrandName) ? LUNA.getBrandName() : 'LUNA ATELIER';
  var brandEl = document.getElementById('loginBrandName');
  if (brandEl) brandEl.textContent = brandName;
  var subEl = document.querySelector('.logo .sub');
  if (subEl) subEl.textContent = '服装订单管理系统';
  document.title = '登录 · ' + brandName;
  if (LUNA && LUNA.syncBrandFromServer) {
    LUNA.syncBrandFromServer(function(err, data) {
      if (!err && data && data.brandName) {
        if (brandEl) brandEl.textContent = data.brandName;
        document.title = '登录 · ' + data.brandName;
      }
    });
  }

  var captchaField = document.getElementById('captchaField');
  if (captchaField) {
    captchaField.innerHTML = '<label id="captchaLabel">人机验证</label>' +
      '<input type="text" id="captchaAnswer" placeholder="请输入答案" autocomplete="off">' +
      '<div style="font-size:11px;color:#999;margin-top:6px">连续输错 3 次后需要完成验证。</div>';
  }
  var loginBtn = document.getElementById('loginBtn');
  if (loginBtn) loginBtn.textContent = '登 录';
  var errorMsg = document.getElementById('errorMsg');
  if (errorMsg) errorMsg.textContent = '账号或密码错误，请重试';
})();

document.getElementById('loginBtn').addEventListener('click', function(e) {
  var user = document.getElementById('username').value.trim();
  var pwd = document.getElementById('password').value.trim();
  var errEl = document.getElementById('errorMsg');

  var captcha = document.getElementById('captchaAnswer').value.trim();
  var result = LUNA.login(user, pwd, captcha);
  if (result && !result.error) {
    errEl.style.display = 'none';
    LUNA.setUser(result);
    window.location.href = loginLandingPage(result);
    return;
  }

  if (result && result.captcha_required) {
    document.getElementById('captchaField').style.display = 'block';
    document.getElementById('captchaLabel').textContent = '人机验证：' + (result.captcha_question || '');
    document.getElementById('captchaLabel').textContent = '验证码：' + (result.captcha_question || '');
  }
  var errMsg = result && result.error ? result.error : '登录失败，请重试';
  if (result && result.captcha_required) document.getElementById('captchaLabel').textContent = '人机验证：' + (result.captcha_question || '');
  errEl.textContent = errMsg;
  errEl.style.display = 'block';
});

function loginLandingPage(user) {
  if (!user) return 'index.html';
  if (user.role === 'admin') return 'dashboard.html';
  if (user.role === 'guest') return 'guest-styles.html';
  if (user.role === 'employee') {
    var role = user.employee_role || '';
    if (role === '加工工厂' || role === '车工') return 'factory.html';
    var prefs = ['marker.html','cutting.html','shipping.html','ready-pickup.html','factory.html','style-manage.html','guest-styles.html'];
    if (Array.isArray(user.permissions)) {
      for (var i = 0; i < prefs.length; i++) {
        if (user.permissions.indexOf(prefs[i]) !== -1) return prefs[i];
      }
    }
    if (role === '排版师') return 'marker.html';
    if (role === '裁剪员') return 'cutting.html';
    if (role === '发货员') return 'shipping.html';
  }
  return 'dashboard.html';
}

// 回车登录
document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});

// 已登录直接跳转
var _exUser = LUNA.getUser();
if (_exUser && _exUser.role) {
  window.location.href = loginLandingPage(_exUser);
}
</script>
</body>
</html>
