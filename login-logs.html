<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<title>登录记录 · LUNA ATELIER</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#faf9f7;color:#1a1a1a}
.page{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.btn{padding:7px 14px;border:1px solid #e0dcd5;border-radius:20px;font-size:12px;cursor:pointer;background:#fff;color:#666;font-family:inherit;transition:all .15s}
.btn:hover{border-color:#c9a96e;color:#c9a96e}
.btn.active{background:#c9a96e;color:#fff;border-color:#c9a96e}
.search{padding:8px 13px;border:1px solid #e0dcd5;border-radius:20px;font-size:12px;font-family:inherit;outline:none;min-width:210px;flex:1;background:#fff}
.search:focus{border-color:#c9a96e}
.panel{display:none;background:#fff;border:1px solid #e8e5e0;border-radius:8px;padding:12px 14px;margin-bottom:12px;gap:10px;align-items:center;flex-wrap:wrap}
.panel.show{display:flex}
.panel strong{font-size:13px}
.panel .status{font-size:12px;padding:3px 10px;border-radius:12px}
.panel .hint{font-size:11px;color:#999}
.ip-panel{display:none;background:#fff;border:1px solid #e8e5e0;border-radius:8px;padding:12px 14px;margin-bottom:12px}
.ip-panel.show{display:block}
.ip-panel .help{font-size:12px;color:#666;margin-bottom:8px}
.ip-panel textarea{width:100%;min-height:62px;border:1px solid #e0dcd5;border-radius:6px;padding:8px;font-family:monospace;font-size:12px;outline:none}
.stats{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;font-size:12px;color:#777}
.stats span{padding:6px 12px;background:#fff;border:1px solid #e8e5e0;border-radius:6px}
.stats strong{color:#1a1a1a}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid #e8e5e0;border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:10px 12px;text-align:left;font-weight:600;color:#888;font-size:11px;letter-spacing:.4px;border-bottom:1px solid #e8e5e0;background:#faf9f7;white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid #f0ede8;vertical-align:middle}
tr:hover td{background:#faf8f5}
.badge-ok,.badge-fail{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.badge-ok{background:#eef5e8;color:#3a8a3a}
.badge-fail{background:#fef0f0;color:#c44}
.muted{color:#999}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.user-link{color:#c9a96e;font-weight:600;cursor:pointer;text-decoration:none}
.empty{text-align:center;padding:56px 20px;color:#bbb;font-size:13px;display:none}
@media(max-width:700px){.page{padding:12px 10px}.search{min-width:160px}th,td{padding:8px}}
</style>
<style id="luna-nav-prehide">.luna-header,.header,.header-inner{display:none!important}</style>
</head>
<body>
<div class="page">
  <div class="toolbar">
    <button class="btn active" id="loginViewBtn" onclick="setView('login',this)">登录记录</button>
    <button class="btn" id="operationViewBtn" onclick="setView('operation',this)">操作记录</button>
    <button class="btn" data-filter="success" onclick="setFilter('success',this)">成功</button>
    <button class="btn" data-filter="fail" onclick="setFilter('fail',this)">失败</button>
    <input class="search" id="searchInput" placeholder="搜索用户名" oninput="loadLogs()">
    <button class="btn" onclick="loadLogs()">刷新</button>
  </div>

  <div class="panel" id="userPanel">
    <strong id="userName"></strong>
    <span class="status" id="userStatus"></span>
    <button class="btn" id="toggleUserBtn" onclick="toggleUser()"></button>
    <span class="hint">禁用后该账号无法登录系统</span>
  </div>

  <div class="ip-panel" id="ipPanel">
    <div class="help">IP 白名单（空=不限制；支持换行/逗号分隔、CIDR 如 192.168.1.0/24、通配如 192.168.*）</div>
    <textarea id="allowedIps"></textarea>
    <button class="btn" onclick="saveIpRules()">保存 IP 限制</button>
  </div>

  <div class="stats" id="statsBar"></div>
  <div class="tbl-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:60px">#</th>
          <th>用户</th>
          <th style="width:90px">状态/操作</th>
          <th>IP 地址</th>
          <th>位置/对象</th>
          <th style="width:170px">时间</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
  <div class="empty" id="emptyState">暂无记录</div>
</div>

<script src="luna-data.js?v=48"></script>
<script>LUNA.renderNav();</script>
<script>
function esc(s){var d=document.createElement('div');d.textContent=s == null ? '' : String(s);return d.innerHTML}
var currentView='login';
var currentFilter='all';
var currentUser='';

function setView(view, el){
  currentView=view;
  currentFilter='all';
  document.querySelectorAll('.toolbar .btn').forEach(function(b){b.classList.remove('active')});
  if(el) el.classList.add('active');
  loadLogs();
}
function setFilter(filter, el){
  currentView='login';
  currentFilter=filter;
  document.querySelectorAll('.toolbar .btn').forEach(function(b){b.classList.remove('active')});
  if(el) el.classList.add('active');
  loadLogs();
}
function selectUser(username){
  document.getElementById('searchInput').value=username || '';
  loadLogs();
}
function loadLogs(){
  var username=document.getElementById('searchInput').value.trim();
  currentUser=username;
  loadUserInfo(username);
  loadIpRules(username);
  var url=(currentView==='operation'?'/api/operation-logs':'/api/login-logs')+'?limit=500';
  if(username) url+='&username='+encodeURIComponent(username);
  var xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.withCredentials=true;
  xhr.onload=function(){
    try{
      var rows=JSON.parse(xhr.responseText);
      if(currentView==='operation') renderOperations(rows);
      else renderLoginRows(rows);
    }catch(e){renderEmpty()}
  };
  xhr.send();
}
function loadUserInfo(username){
  var panel=document.getElementById('userPanel');
  if(!username){panel.classList.remove('show');return}
  var xhr=new XMLHttpRequest();
  xhr.open('GET','/api/data/users',true);
  xhr.withCredentials=true;
  xhr.onload=function(){
    try{
      var users=JSON.parse(xhr.responseText);
      var user=(users||[]).find(function(u){return u.username===username});
      if(!user){panel.classList.remove('show');return}
      var enabled=user.enabled!==false && user.enabled!==0;
      panel.classList.add('show');
      document.getElementById('userName').textContent=username;
      var status=document.getElementById('userStatus');
      status.textContent=enabled?'已启用':'已禁用';
      status.style.background=enabled?'#eef5e8':'#fef0f0';
      status.style.color=enabled?'#3a8a3a':'#c44';
      var btn=document.getElementById('toggleUserBtn');
      btn.textContent=enabled?'禁用此账号':'启用此账号';
      btn.dataset.enabled=enabled?'1':'0';
    }catch(e){panel.classList.remove('show')}
  };
  xhr.send();
}
function loadIpRules(username){
  var panel=document.getElementById('ipPanel');
  if(!username){panel.classList.remove('show');return}
  panel.classList.add('show');
  var xhr=new XMLHttpRequest();
  xhr.open('GET','/api/users/'+encodeURIComponent(username)+'/ip-rules',true);
  xhr.withCredentials=true;
  xhr.onload=function(){
    try{document.getElementById('allowedIps').value=(JSON.parse(xhr.responseText).allowed_ips||'')}catch(e){}
  };
  xhr.send();
}
function saveIpRules(){
  if(!currentUser){alert('先搜索一个用户');return}
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/users/'+encodeURIComponent(currentUser)+'/ip-rules',true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.withCredentials=true;
  xhr.onload=function(){
    try{var r=JSON.parse(xhr.responseText);alert(r.ok?'IP 限制已保存':(r.error||'保存失败'));loadLogs()}catch(e){alert('保存失败')}
  };
  xhr.send(JSON.stringify({allowed_ips:document.getElementById('allowedIps').value}));
}
function toggleUser(){
  if(!currentUser) return;
  var xhr=new XMLHttpRequest();
  xhr.open('POST','/api/users/'+encodeURIComponent(currentUser)+'/toggle-enabled',true);
  xhr.withCredentials=true;
  xhr.onload=function(){
    try{var r=JSON.parse(xhr.responseText);alert(r.ok?('账号 '+currentUser+' '+r.status_text):(r.error||'操作失败'));loadLogs()}catch(e){alert('请求失败')}
  };
  xhr.send('{}');
}
function renderLoginRows(rows){
  if(currentFilter==='success') rows=rows.filter(function(r){return r.success===1});
  if(currentFilter==='fail') rows=rows.filter(function(r){return r.success===0});
  var total=rows.length;
  var suc=rows.filter(function(r){return r.success===1}).length;
  document.getElementById('statsBar').innerHTML='<span>总计 <strong>'+total+'</strong></span><span>成功 <strong>'+suc+'</strong></span><span>失败 <strong>'+(total-suc)+'</strong></span>';
  renderRows(rows.map(function(r,i){
    return [
      total-i,
      '<a class="user-link" onclick="selectUser(\''+esc(r.username).replace(/'/g,'&#39;')+'\')">'+esc(r.username)+'</a>',
      r.success===1?'<span class="badge-ok">成功</span>':'<span class="badge-fail">失败</span>',
      '<span class="mono muted">'+esc(r.ip||'-')+'</span>',
      esc(r.location||'-'),
      esc(r.created_at||'')
    ];
  }));
}
function renderOperations(rows){
  var total=rows.length;
  document.getElementById('statsBar').innerHTML='<span>操作记录 <strong>'+total+'</strong></span>';
  renderRows(rows.map(function(r,i){
    return [
      total-i,
      '<a class="user-link" onclick="selectUser(\''+esc(r.username).replace(/'/g,'&#39;')+'\')">'+esc(r.username||'-')+'</a>',
      '<span class="badge-ok">'+esc(r.action||'操作')+'</span>',
      '<span class="mono muted">'+esc(r.ip||'-')+'</span>',
      esc((r.target||'-')+(r.detail?' · '+r.detail:'')),
      esc(r.created_at||'')
    ];
  }));
}
function renderRows(rows){
  var body=document.getElementById('logBody');
  var empty=document.getElementById('emptyState');
  if(!rows.length){renderEmpty();return}
  empty.style.display='none';
  body.innerHTML=rows.map(function(cols){
    return '<tr>'+cols.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>';
  }).join('');
}
function renderEmpty(){
  document.getElementById('logBody').innerHTML='';
  document.getElementById('emptyState').style.display='block';
}
(function(){
  var u=LUNA.getUser();
  if(!u || u.role!=='admin'){window.location.href='index.html';return}
  loadLogs();
})();
</script>
</body>
</html>
